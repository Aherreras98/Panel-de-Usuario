<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Usuario</title>
    <link rel="stylesheet" href="style.css">
    <script src="src/main.js" type="module" defer></script>
</head>
<body>

    <main id="screen-login" class="screen">
        <form class="form-container" id="login-form">
            <h2>Iniciar sesión</h2>
            <p id="login-error" class="error-message"></p>
            <div class="input-group">
                <label for="login-username">Usuario</label>
                <input type="text" id="login-username" required>
            </div>
            <div class="input-group">
                <label for="login-password">Contraseña</label>
                <input type="password" id="login-password" required>
            </div>
            <button type="submit" class="btn">Entrar</button>
            <p>¿No tienes cuenta? <a href="#" id="goto-register">Regístrate</a></p>
        </form>
    </main>

    <main id="screen-register" class="screen hidden">
        <form class="form-container" id="register-form">
            <h2>Registro</h2>
            
            <div class="input-group">
                <label for="reg-username">Nombre de usuario</label>
                <input type="text" id="reg-username" required>
                <p id="error-username" class="error-message"></p>
            </div>
            
            <div class="input-group password-wrapper">
                <label for="reg-password">Contraseña</label>
                <input type="password" id="reg-password" required>
                <span id="toggle-password">👁️</span>
                <p id="error-password" class="error-message"></p>
            </div>

            <div class="input-group">
                <label for="reg-phone">Teléfono</label>
                <input type="tel" id="reg-phone" required>
                <p id="error-phone" class="error-message"></p>
            </div>

            <div class="input-group">
                <label for="reg-zipcode">Código postal</label>
                <input type="text" id="reg-zipcode" required>
                <p id="error-zipcode" class="error-message"></p>
            </div>

            <div class="input-group-check">
                <input type="checkbox" id="reg-over18">
                <label for="reg-over18">Soy mayor de edad</label>
            </div>

            <div class="input-group hidden" id="age-field">
                <label for="reg-age">Edad (opcional)</label>
                <input type="number" id="reg-age">
                <p id="error-age" class="error-message"></p>
            </div>
            
            <button type="submit" id="register-btn" class="btn" disabled>Crear cuenta</button>
            <p id="register-success" class="success-message"></p>
            <p>¿Ya tienes cuenta? <a href="#" id="goto-login">Inicia sesión</a></p>
        </form>
    </main>

    <main id="screen-panel" class="screen hidden">
        <div class="panel-container">
            <h2 id="welcome-message">Bienvenido, ...</h2>
            <div class="panel-buttons">
                <button id="theme-toggle-btn" class="btn">Cambiar tema</button>
                <button id="logout-btn" class="btn">Cerrar sesión</button>
            </div>
        </div>
    </main>

    <div id="cookie-banner" class="cookie-banner hidden">
        <p>Usamos cookies para recordar tus preferencias. ¿Aceptas?</p>
        <button id="accept-cookies-btn" class="btn">Aceptar</button>
    </div>

</body>
</html>
